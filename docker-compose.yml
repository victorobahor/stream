services:
  streamzone:
    build: .
    image: v1kt0r2020/streamzone:latest
    container_name: streamzone_app
    entrypoint: ["node", "embed-proxy/server.mjs"]
    ports:
      - "8081:80"
    shm_size: "2gb"
    environment:
      # SportSRC experiment — pass the key at runtime, never bake into the image.
      SPORTSRC_API_KEY: ${SPORTSRC_API_KEY}
      SPORTSRC_CACHE_TTL_MS: "30000"
      # Native HLS remains available but client defaults off for SportSRC embeds.
      HLS_MAX_SESSIONS: "24"
      HLS_MAX_OPENS: "6"
      HLS_OPEN_RATE_MAX: "48"
      HLS_OPEN_WAIT_MS: "45000"
      HLS_MINT_CACHE_TTL_MS: "120000"
    restart: unless-stopped
