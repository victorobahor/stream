name: Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Grants the runner permissions to write to your GitHub Packages tab
permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npm run test

    # 1. Log in to Docker Hub (using your repository secrets)
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3.3.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 2. Log in to GitHub Container Registry (uses built-in automatic token)
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3.3.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. Build and push to BOTH destinations simultaneously
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/streamzone:sha-${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/streamzone:latest
          ghcr.io/${{ github.repository_owner }}/streamzone:sha-${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/streamzone:latest

    # 4. Authenticate to Google Cloud
    - name: Authenticate to Google Cloud
      if: github.event_name != 'pull_request'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    # 5. Deploy to Cloud Run
    - name: Deploy to Cloud Run
      if: github.event_name != 'pull_request'
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: streamzone
        region: europe-west1
        # You can use either the Docker Hub or GHCR image here.
        # Using GHCR is often faster for GitHub Actions.
        image: ghcr.io/${{ github.repository_owner }}/streamzone:sha-${{ github.sha }}
        env_vars: |-
          HLS_MAX_OPENS=2
          HLS_MAX_SESSIONS=24
          HLS_OPEN_WAIT_MS=45000
          HLS_OPEN_RATE_MAX=48
          HLS_MINT_CACHE_TTL_MS=120000
