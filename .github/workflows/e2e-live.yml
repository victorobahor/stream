name: Live E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site under test'
        required: false
        default: 'https://stream.vicktalk.online'
  schedule:
    # Daily smoke against production
    - cron: '0 8 * * *'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live e2e tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://stream.vicktalk.online' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
